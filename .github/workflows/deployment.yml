name: Deploy Portal to Nginx (app.pacesystem.co.ke)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Next.js Static Export and Deploy via SSH Password

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 4. Build Static Next.js Web App
        env:
          NEXT_PUBLIC_API_URL: 'https://api.pacesystem.co.ke/v1'
        run: |
          npm run build

      - name: 5. Verify Build Output
        run: |
          ls -la out/

      - name: 6. Deploy to Nginx Web Root via SSH (Password Authentication)
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass rsync
          TARGET="${{ secrets.TARGET_DIR || '/var/www/app.pacesystem.co.ke/html' }}"
          PORT="22"
          
          # Create target directory if it doesn't exist
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p "$PORT" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p $TARGET"
          
          # Sync static export files
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" rsync -avzr --delete -e "ssh -o StrictHostKeyChecking=no -p $PORT" out/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:"$TARGET"
          
          # Fix Nginx web permissions and reload Nginx service
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p "$PORT" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "chown -R www-data:www-data $TARGET && chmod -R 755 $TARGET && (systemctl reload nginx || service nginx reload || true)"
